services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: qingprocess
      POSTGRES_USER: qingprocess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingprocess -d qingprocess"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://qingprocess:${POSTGRES_PASSWORD}@db:5432/qingprocess
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
      NODE_ENV: production
      MODEL_CONFIG_KEY: ${MODEL_CONFIG_KEY:-}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-api.openai.com,api.deepseek.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MACHINE_ID: ${MACHINE_ID:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  database:
