              </div>
            ` : ''}
          </div>
          <div class="swim-tb-sep"></div>
          <button type="button" class="swim-tb-btn" data-swim-act="autoFitSwimlane" title="自动契合内部所有活动节点边界">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2.5 5.5V2.5H5.5M10.5 2.5H13.5V5.5M13.5 10.5V13.5H10.5M5.5 13.5H2.5V10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="5.5" y="5.5" width="5" height="5" rx="0.8" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </button>
          <div id="swimThemePopover" style="display:${swimThemePopoverOpen ? 'flex' : 'none'}">
            ${SWIMLANE_THEMES.map((t, idx) => `
              <div class="swim-theme-swatch ${cfg.themeIndex === idx ? 'active' : ''}" data-swim-theme="${idx}" title="${t.name}" style="background:${t.swatch};border:1px solid ${t.stroke};"></div>
            `).join('')}
          </div>
        `;
      }

      swimlaneToolbar.addEventListener('mousedown', (ev) => ev.stopPropagation());
      swimlaneToolbar.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (selectedIds.size !== 1) return;
        const selId = Array.from(selectedIds)[0];
        const cell = cells.find(c => c.id === selId && c.vertex);
        if (!cell || !isContainerSwimlane(cell)) return;

        const themeEl = ev.target.closest('[data-swim-theme]');
        if (themeEl) {
          saveHistory();
          const idx = Number(themeEl.getAttribute('data-swim-theme') || 0);
          const cfg = getSwimlaneConfig(cell);
          cfg.themeIndex = idx;
          syncSwimlaneValueFromConfig(cell, cfg);
          swimThemePopoverOpen = false;
          render();
          emitSelectionToHost();
          notifyAutosave();
          return;
        }

        const btn = ev.target.closest('[data-swim-act]');
        if (!btn) return;
        const act = btn.getAttribute('data-swim-act');
        const cfg = getSwimlaneConfig(cell);

        if (act === 'toggleThemePopover') {
          swimThemePopoverOpen = !swimThemePopoverOpen;
          updateSwimlaneToolbar();
          return;
        }

        saveHistory();
        if (act === 'laneInc') {
          const prevCount = cfg.laneCount;
          cfg.laneCount = Math.min(12, prevCount + 1);
          if (cfg.lanes.length < cfg.laneCount) {
            cfg.lanes.push(`泳道 ${cfg.laneCount}`);
          }
          if (prevCount >= 1) {
            if (cfg.orientation === 'vertical') {
              const singleW = Math.max(160, Math.round(cell.width / prevCount));
              cell.width = Math.round((cell.width + singleW) / 10) * 10;
            } else {
              const singleH = Math.max(140, Math.round(cell.height / prevCount));
              cell.height = Math.round((cell.height + singleH) / 10) * 10;
            }
          }
        } else if (act === 'laneDec') {
          if (cfg.laneCount > 0) {
            const prevCount = cfg.laneCount;
            cfg.laneCount = prevCount - 1;
            if (prevCount > 1) {
              if (cfg.orientation === 'vertical') {
                const singleW = Math.round(cell.width / prevCount);
                cell.width = Math.max(240, Math.round((cell.width - singleW) / 10) * 10);
              } else {
                const singleH = Math.round(cell.height / prevCount);
                cell.height = Math.max(180, Math.round((cell.height - singleH) / 10) * 10);
              }
            }
          }
        } else if (act === 'toggleOrientation') {
          const nextOrient = cfg.orientation === 'vertical' ? 'horizontal' : 'vertical';
          cfg.orientation = nextOrient;
          cfg.textDir = nextOrient === 'horizontal' ? 'vertical' : 'horizontal';
          const oldW = cell.width;
          cell.width = Math.max(240, cell.height);
          cell.height = Math.max(220, oldW);
          if (cell.attrs) {
            cell.attrs.dflowType = cfg.laneCount > 0
              ? (nextOrient === 'horizontal' ? 'swimlanePoolH' : 'swimlanePoolV')
              : (nextOrient === 'horizontal' ? 'swimlaneH' : 'swimlaneV');
          }
        } else if (act === 'toggleTextDir') {
          cfg.textDir = cfg.textDir === 'vertical' ? 'horizontal' : 'vertical';
        } else if (act === 'toggleHeaderFlip') {
          cfg.headerFlipped = !cfg.headerFlipped;
        } else if (act === 'togglePoolHeader') {
          cfg.showPoolHeader = !cfg.showPoolHeader;
        } else if (act === 'toggleLaneStriped') {
          cfg.laneStriped = !cfg.laneStriped;
        } else if (act === 'toggleInnerDashed') {
          cfg.innerDashed = !cfg.innerDashed;
        } else if (act === 'stageAddOrToggle') {
          if (cfg.stageCount === 0) {
            cfg.stageCount = 2;
            cfg.stages = ['阶段 1', '阶段 2'];
          } else {
            cfg.stageCount = 0;
          }
        } else if (act === 'stageInc') {
          cfg.stageCount = Math.min(8, cfg.stageCount + 1);
          while (cfg.stages.length < cfg.stageCount) {
            cfg.stages.push(`阶段 ${cfg.stages.length + 1}`);
          }
        } else if (act === 'stageDec') {
          cfg.stageCount = Math.max(0, cfg.stageCount - 1);
        } else if (act === 'autoFitSwimlane') {
          const innerNodes = cells.filter(n => {
            if (!n.vertex || n.id === cell.id || isContainerSwimlane(n)) return false;
            const cx = n.x + (n.width || 100) / 2;
            const cy = n.y + (n.height || 50) / 2;
            return cx >= cell.x - 40 && cx <= cell.x + cell.width + 40 && cy >= cell.y - 40 && cy <= cell.y + cell.height + 40;
          });
          if (innerNodes.length > 0) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            innerNodes.forEach(n => {
              minX = Math.min(minX, n.x);
              minY = Math.min(minY, n.y);
              maxX = Math.max(maxX, n.x + (n.width || 100));
              maxY = Math.max(maxY, n.y + (n.height || 50));
            });
            const padLeft = cfg.orientation === 'horizontal' ? 88 : 48;
            const padTop = cfg.orientation === 'vertical' ? 84 : 48;
            cell.x = Math.round((minX - padLeft) / 10) * 10;
            cell.y = Math.round((minY - padTop) / 10) * 10;
            cell.width = Math.max(280, Math.round((maxX - cell.x + 56) / 10) * 10);
            cell.height = Math.max(240, Math.round((maxY - cell.y + 56) / 10) * 10);
          }
        }

        syncSwimlaneValueFromConfig(cell, cfg);
        render();
        emitSelectionToHost();
        notifyAutosave();
      });

      function serializeCellForHost(cell) {
        if (!cell) return null;
        return {
          id: cell.id,
          value: cell.value || '',
          style: cell.style || '',
          styleMap: parseStyle(cell.style || ''),
          vertex: !!cell.vertex,
          edge: !!cell.edge,
          geometry: { x: cell.x, y: cell.y, width: cell.width, height: cell.height },
          attrs: { ...(cell.attrs || {}), label: cell.value || '' }
        };
      }

      function clientToGraph(clientX, clientY) {
        const rect = svgStage.getBoundingClientRect();
        return {
          x: (clientX - rect.left - panX) / zoom,
          y: (clientY - rect.top - panY) / zoom
        };
      }

      function createEdgeBetween(sourceId, targetId) {
        if (!sourceId || !targetId || sourceId === targetId) return;
        const exists = cells.some(c => c.edge && c.source === sourceId && c.target === targetId);
        if (exists) return;
        saveHistory();
        const edgeStyleMap = {
          edgeStyle: defaultEdgeStyle.edgeStyle || 'orthogonalEdgeStyle',
          rounded: '0',
          orthogonalLoop: '1',
          jettySize: 'auto',
          html: '1',
          strokeColor: defaultEdgeStyle.strokeColor || '#333333',
          strokeWidth: defaultEdgeStyle.strokeWidth || '2',
          dashed: defaultEdgeStyle.dashed || '0',
          dashPattern: defaultEdgeStyle.dashPattern || '',
          endArrow: defaultEdgeStyle.endArrow || 'classic',
          flowAnimation: defaultEdgeStyle.flowAnimation || '0'
        };
        const newEdge = {
          id: 'edge_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          value: '',
          style: stringifyStyle(edgeStyleMap),
          vertex: false,
          edge: true,
          source: sourceId,
          target: targetId,
          x: 0, y: 0, width: 0, height: 0,
          attrs: {}
        };
        cells.push(newEdge);
        selectedIds = new Set([newEdge.id]);
        lastSelectedId = newEdge.id;
        render();
        emitSelectionToHost();
        notifyAutosave();
      }

      function notifyAutosave() {
        const xml = serializeCellsToXml();
        postToHost({ event: 'autosave', xml });
      }

      function fitViewport(opts = {}) {
        const vertices = cells.filter(c => c.vertex);
        const rect = container.getBoundingClientRect();
        if (vertices.length === 0 || rect.width === 0 || rect.height === 0) {
          zoom = 1;
          panX = 60;
          panY = 40;
          render();
          return;
        }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        vertices.forEach(v => {
          minX = Math.min(minX, v.x);
          minY = Math.min(minY, v.y);
          maxX = Math.max(maxX, v.x + (v.width || 100));
          maxY = Math.max(maxY, v.y + (v.height || 50));
        });
        const border = opts.border || 56;
        const maxScale = opts.maxScale || 1.15;
        const contentW = Math.max(120, maxX - minX);
        const contentH = Math.max(80, maxY - minY);
        const scaleX = (rect.width - border * 2) / contentW;
        const scaleY = (rect.height - border * 2) / contentH;
        zoom = Math.max(0.35, Math.min(maxScale, Math.min(scaleX, scaleY)));
        panX = Math.round((rect.width - contentW * zoom) / 2 - minX * zoom);
        panY = Math.round((rect.height - contentH * zoom) / 2 - minY * zoom);
        render();
      }

      function autoLayoutGraph() {
        const vertices = cells.filter(c => c.vertex && !isContainerSwimlane(c));
        if (vertices.length === 0) return;
        saveHistory();
        const cols = Math.min(4, Math.max(1, Math.ceil(Math.sqrt(vertices.length))));
        vertices.forEach((v, idx) => {
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          v.x = 120 + col * 200;
          v.y = 80 + row * 120;
        });
        fitViewport();
        notifyAutosave();
      }

      function alignSelectedVertices(mode) {
        const selVertices = cells.filter(c => c.vertex && selectedIds.has(c.id));
        if (selVertices.length === 0 && lastSelectedId) {
          const last = cells.find(c => c.id === lastSelectedId && c.vertex);
          if (last) selVertices.push(last);
        }
        if (selVertices.length === 0) return;

        saveHistory();
        if (selVertices.length === 1) {
          const v = selVertices[0];
          const s = parseStyle(v.style);
          if (mode === 'left') s.align = 'left';
          else if (mode === 'centerH') s.align = 'center';
          else if (mode === 'right') s.align = 'right';
          else if (mode === 'top') s.verticalAlign = 'top';
          else if (mode === 'centerV') s.verticalAlign = 'middle';
          else if (mode === 'bottom') s.verticalAlign = 'bottom';
          v.style = stringifyStyle(s);
          render();
          notifyAutosave();
          emitSelectionToHost();
          return;
        }

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        selVertices.forEach(v => {
          minX = Math.min(minX, v.x);
          maxX = Math.max(maxX, v.x + (v.width || 100));
          minY = Math.min(minY, v.y);
          maxY = Math.max(maxY, v.y + (v.height || 50));
        });
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        if (mode === 'left') {
          selVertices.forEach(v => { v.x = Math.round(minX / 10) * 10; });
        } else if (mode === 'right') {
          selVertices.forEach(v => { v.x = Math.round((maxX - (v.width || 100)) / 10) * 10; });
        } else if (mode === 'centerH') {
          selVertices.forEach(v => { v.x = Math.round((centerX - (v.width || 100) / 2) / 10) * 10; });
        } else if (mode === 'top') {
          selVertices.forEach(v => { v.y = Math.round(minY / 10) * 10; });
        } else if (mode === 'bottom') {
          selVertices.forEach(v => { v.y = Math.round((maxY - (v.height || 50)) / 10) * 10; });
        } else if (mode === 'centerV') {
          selVertices.forEach(v => { v.y = Math.round((centerY - (v.height || 50) / 2) / 10) * 10; });
        } else if (mode === 'distributeH' && selVertices.length >= 3) {
          const sorted = [...selVertices].sort((a, b) => a.x - b.x);
          const first = sorted[0].x;
          const last = sorted[sorted.length - 1].x;
          const step = (last - first) / (sorted.length - 1);
          sorted.forEach((v, i) => { v.x = Math.round((first + i * step) / 10) * 10; });
        } else if (mode === 'distributeV' && selVertices.length >= 3) {
          const sorted = [...selVertices].sort((a, b) => a.y - b.y);
          const first = sorted[0].y;
          const last = sorted[sorted.length - 1].y;
          const step = (last - first) / (sorted.length - 1);
          sorted.forEach((v, i) => { v.y = Math.round((first + i * step) / 10) * 10; });
        }
        render();
        notifyAutosave();
        emitSelectionToHost();
      }

      function openInlineEditor(cell, clientX, clientY, swimEditTarget = null) {
        inlineEditor.style.display = 'block';

        const isSwim = isContainerSwimlane(cell);
        const cfg = isSwim ? getSwimlaneConfig(cell) : null;
        const dflowType = cell.attrs?.dflowType || '';
        const lines = String(cell.value || '').split('\n');

        if (cell.vertex && !isSwim) {
          const rect = svgStage.getBoundingClientRect();
          const nodeScreenX = rect.left + panX + cell.x * zoom;
          const nodeScreenY = rect.top + panY + cell.y * zoom;
          const nodeScreenW = (cell.width || 100) * zoom;
          const nodeScreenH = (cell.height || 50) * zoom;

          const editorW = Math.max(90, Math.min(nodeScreenW - 4, 260));
          const editorH = Math.max(26, Math.min(30 * zoom, 34));
          const editorLeft = Math.round(nodeScreenX + (nodeScreenW - editorW) / 2);
          let editorTop;
          if (dflowType === 'nodeActiveSerialRect' && lines.length >= 2) {
            const headerH = 22 * zoom;
            editorTop = Math.round(nodeScreenY + headerH + ((nodeScreenH - headerH) - editorH) / 2);
          } else {
            editorTop = Math.round(nodeScreenY + (nodeScreenH - editorH) / 2);
          }

          inlineEditor.style.left = `${editorLeft}px`;
          inlineEditor.style.top = `${editorTop}px`;
          inlineEditor.style.width = `${Math.round(editorW)}px`;
          inlineEditor.style.height = `${Math.round(editorH)}px`;
          inlineEditor.style.fontSize = `${Math.max(12, Math.round(13 * zoom))}px`;
        } else {
          inlineEditor.style.left = `${(clientX || 100) - 60}px`;
          inlineEditor.style.top = `${(clientY || 100) - 16}px`;
          inlineEditor.style.width = '140px';
          inlineEditor.style.height = '30px';
          inlineEditor.style.fontSize = '13px';
        }

        if (isSwim && cfg && swimEditTarget) {
          if (swimEditTarget === 'pool') {
            inlineEditor.value = cfg.poolTitle || '';
          } else if (swimEditTarget.startsWith('lane:')) {
            const idx = Number(swimEditTarget.split(':')[1] || 0);
            inlineEditor.value = cfg.lanes[idx] || '';
          } else if (swimEditTarget.startsWith('stage:')) {
            const idx = Number(swimEditTarget.split(':')[1] || 0);
            inlineEditor.value = cfg.stages[idx] || '';
          } else {
            inlineEditor.value = cell.value || '';
          }
        } else if (dflowType === 'nodeActiveSerialRect' && lines.length >= 2) {
          inlineEditor.value = cell.attrs?.name || lines.slice(1).join(' ') || '';
        } else {
          inlineEditor.value = cell.attrs?.name || cell.value || '';
        }

        setTimeout(() => {
          inlineEditor.focus();
          inlineEditor.select();
        }, 20);

        const commit = () => {
          if (inlineEditor.style.display === 'none') return;
          inlineEditor.style.display = 'none';
          const newVal = inlineEditor.value.trim();

          if (isSwim && cfg && swimEditTarget) {
            saveHistory();
            if (swimEditTarget === 'pool') {
              cfg.poolTitle = newVal || '泳池';
            } else if (swimEditTarget.startsWith('lane:')) {
              const idx = Number(swimEditTarget.split(':')[1] || 0);
              cfg.lanes[idx] = newVal || `泳道 ${idx + 1}`;
            } else if (swimEditTarget.startsWith('stage:')) {
              const idx = Number(swimEditTarget.split(':')[1] || 0);
              cfg.stages[idx] = newVal || `阶段 ${idx + 1}`;
            }
            syncSwimlaneValueFromConfig(cell, cfg);
            render();
            emitSelectionToHost();
            postToHost({ event: 'dflow:openProps', cell: serializeCellForHost(cell) });
            notifyAutosave();
          } else if (newVal !== '') {
            saveHistory();
            if (dflowType === 'nodeActiveSerialRect' && lines.length >= 2) {
              const serial = lines[0];
              cell.value = `${serial}\n${newVal}`;
              if (!cell.attrs) cell.attrs = {};
              cell.attrs.name = newVal;
            } else {
              cell.value = newVal;
              if (!cell.attrs) cell.attrs = {};
              cell.attrs.name = newVal;
            }
            render();
            emitSelectionToHost();
            postToHost({ event: 'dflow:openProps', cell: serializeCellForHost(cell) });
            notifyAutosave();
          }
        };

        inlineEditor.onblur = commit;
        inlineEditor.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            commit();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            inlineEditor.style.display = 'none';
          }
        };
        inlineEditor.onmousedown = (e) => e.stopPropagation();
        inlineEditor.onclick = (e) => e.stopPropagation();
        inlineEditor.ondblclick = (e) => e.stopPropagation();
      }

      function setConnectMode(active) {
        connectModeActive = active;
        if (active) {
          container.classList.add('connecting');
        } else {
          container.classList.remove('connecting');
        }
        emitCanvasStats();
      }

      function setPointerTool(tool) {
        pointerTool = tool;
        if (tool === 'pan') {
          container.classList.add('pan-mode');
        } else {
          container.classList.remove('pan-mode');
        }
        emitCanvasStats();
      }

      container.addEventListener('contextmenu', (ev) => ev.preventDefault());

      container.addEventListener('mousedown', (ev) => {
        if (ev.target !== svgStage && ev.target !== container) return;

        if (ev.button === 1 || ev.button === 2 || spaceKeyDown || pointerTool === 'pan' || isReadOnly) {
          isPanning = true;
          container.classList.add('panning');
          panStart = { x: ev.clientX - panX, y: ev.clientY - panY };
          return;
        }

        if (ev.button === 0) {
          const additive = ev.shiftKey || ev.ctrlKey || ev.metaKey;
          if (!additive) {
            selectedIds.clear();
            render();
            emitSelectionToHost();
          }
          rubberbandState = {
            startClientX: ev.clientX,
            startClientY: ev.clientY,
            additive,
            baseSelected: new Set(selectedIds)
          };
          rubberbandBox.style.left = `${ev.clientX}px`;
          rubberbandBox.style.top = `${ev.clientY}px`;
          rubberbandBox.style.width = '0px';
          rubberbandBox.style.height = '0px';
          rubberbandBox.style.display = 'block';
        }
      });

      container.addEventListener('dblclick', (ev) => {
        if (ev.target === svgStage || ev.target === container) {
          postToHost({ event: 'dflow:openProps', cell: null });
        }
      });

      window.addEventListener('mousemove', (ev) => {
        if (isPanning) {
          panX = ev.clientX - panStart.x;
          panY = ev.clientY - panStart.y;
          render();
        } else if (resizeState) {
          const pt = clientToGraph(ev.clientX, ev.clientY);
          const dx = pt.x - resizeState.startGraphX;
          const dy = pt.y - resizeState.startGraphY;
          if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
            if (!resizeState.moved) {
              saveHistory();
              resizeState.moved = true;
            }
            const dir = resizeState.dir;
            let nx = resizeState.origX;
            let ny = resizeState.origY;
            let nw = resizeState.origW;
            let nh = resizeState.origH;
            const minW = isSwimlaneSeparator(resizeState.cell) ? 16 : 40;
            const minH = isSwimlaneSeparator(resizeState.cell) ? 16 : 30;

            if (dir.includes('e')) {
              nw = Math.max(minW, Math.round((resizeState.origW + dx) / 10) * 10);
            }
            if (dir.includes('s')) {
              nh = Math.max(minH, Math.round((resizeState.origH + dy) / 10) * 10);
            }
            if (dir.includes('w')) {
              const candidateW = Math.max(minW, Math.round((resizeState.origW - dx) / 10) * 10);
              nx = resizeState.origX + (resizeState.origW - candidateW);
              nw = candidateW;
            }
            if (dir.includes('n')) {
              const candidateH = Math.max(minH, Math.round((resizeState.origH - dy) / 10) * 10);
              ny = resizeState.origY + (resizeState.origH - candidateH);
              nh = candidateH;
            }
            resizeState.cell.x = nx;
            resizeState.cell.y = ny;
            resizeState.cell.width = nw;
            resizeState.cell.height = nh;
            render();
          }
        } else if (rubberbandState) {
          const x1 = Math.min(rubberbandState.startClientX, ev.clientX);
          const y1 = Math.min(rubberbandState.startClientY, ev.clientY);
          const x2 = Math.max(rubberbandState.startClientX, ev.clientX);
          const y2 = Math.max(rubberbandState.startClientY, ev.clientY);
          rubberbandBox.style.left = `${x1}px`;
          rubberbandBox.style.top = `${y1}px`;
          rubberbandBox.style.width = `${x2 - x1}px`;
          rubberbandBox.style.height = `${y2 - y1}px`;

          const gStart = clientToGraph(x1, y1);
          const gEnd = clientToGraph(x2, y2);
          const nextSel = new Set(rubberbandState.baseSelected);

          cells.forEach(c => {
            if (c.vertex) {
              const cx1 = c.x;
              const cy1 = c.y;
              const cx2 = c.x + (c.width || 100);
              const cy2 = c.y + (c.height || 50);
              if (isContainerSwimlane(c)) {
                const enclosed = gStart.x <= cx1 + 20 && gEnd.x >= cx2 - 20 && gStart.y <= cy1 + 20 && gEnd.y >= cy2 - 20;
                if (enclosed) nextSel.add(c.id);
              } else {
                const intersects = !(cx2 < gStart.x || cx1 > gEnd.x || cy2 < gStart.y || cy1 > gEnd.y);
                if (intersects) nextSel.add(c.id);
              }
            }
          });
          cells.forEach(c => {
            if (c.edge && nextSel.has(c.source) && nextSel.has(c.target)) {
              nextSel.add(c.id);
            }
          });
          selectedIds = nextSel;
          render();
        } else if (groupDragState) {
          const pt = clientToGraph(ev.clientX, ev.clientY);
          const dx = pt.x - groupDragState.startGraphX;
          const dy = pt.y - groupDragState.startGraphY;
          if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
            if (!groupDragState.moved) {
              saveHistory();
              groupDragState.moved = true;
            }
            groupDragState.items.forEach(item => {
              item.cell.x = Math.round((item.origX + dx) / 10) * 10;
              item.cell.y = Math.round((item.origY + dy) / 10) * 10;
            });
            render();
          }
        } else if (connectFromState) {
          const pt = clientToGraph(ev.clientX, ev.clientY);
          tempEdgeLayer.innerHTML = `<line x1="${connectFromState.startX}" y1="${connectFromState.startY}" x2="${pt.x}" y2="${pt.y}" stroke="#1677ff" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-selected)"/>`;
        }
      });

      window.addEventListener('mouseup', (ev) => {
        if (isPanning) {
          isPanning = false;
          container.classList.remove('panning');
        }
        if (resizeState) {
          if (resizeState.moved) {
            notifyAutosave();
            emitSelectionToHost();
          }
          resizeState = null;
        }
        if (rubberbandState) {
          rubberbandBox.style.display = 'none';
          rubberbandState = null;
          emitSelectionToHost();
        }
        if (groupDragState) {
          if (groupDragState.moved) notifyAutosave();
          groupDragState = null;
        }
        if (connectFromState) {
          tempEdgeLayer.innerHTML = '';
          const nodeEl = ev.target?.closest?.('.mx-node');
          if (nodeEl && nodeEl.dataset.id && nodeEl.dataset.id !== connectFromState.sourceId) {
            createEdgeBetween(connectFromState.sourceId, nodeEl.dataset.id);
          }
          connectFromState = null;
        }
      });

      container.addEventListener('wheel', (ev) => {
        ev.preventDefault();
        const factor = ev.deltaY < 0 ? 1.1 : 0.9;
        zoom = Math.max(0.25, Math.min(2.5, zoom * factor));
        render();
      }, { passive: false });

      window.addEventListener('dragover', (ev) => {
        ev.preventDefault();
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'copy';
      });

      window.addEventListener('drop', (ev) => {
        ev.preventDefault();
        if (isReadOnly) return;
        const raw = ev.dataTransfer?.getData('application/dflow-shape') || ev.dataTransfer?.getData('text/plain');
        if (!raw) return;
        try {
          const shape = JSON.parse(raw);
          if (shape && shape.type) {
            insertShapeAtClientPoint(shape, ev.clientX, ev.clientY, false);
          }
        } catch (e) {}
      });

      function insertShapeAtClientPoint(msg, clientX, clientY, autoOffset) {
        saveHistory();
        const rect = container.getBoundingClientRect();
        const targetClientX = clientX !== undefined ? clientX : (rect.left + rect.width / 2);
        const targetClientY = clientY !== undefined ? clientY : (rect.top + rect.height / 2);
        const pt = clientToGraph(targetClientX, targetClientY);
        const w = msg.w || 100;
        const h = msg.h || 50;
        const offset = autoOffset ? (cells.filter(c => c.vertex).length % 5) * 16 : 0;
        const baseStyle = parseStyle(msg.style || 'rounded=0;whiteSpace=wrap;html=1;');
        Object.keys(defaultNodeStyle).forEach(k => {
          if (!baseStyle[k]) baseStyle[k] = defaultNodeStyle[k];
        });
        const finalStyle = stringifyStyle(baseStyle);

        const newCell = {
          id: 'node_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          value: msg.label || '节点',
          style: finalStyle,
          vertex: true,
          edge: false,
          x: Math.round((pt.x - w / 2 + offset) / 10) * 10,
          y: Math.round((pt.y - h / 2 + offset) / 10) * 10,
          width: w,
          height: h,
          attrs: {
            dflowType: msg.type || 'nodeActiveFlow',
            name: msg.label || '节点',
            target: 0,
            timeType: '天'
          }
        };
        cells.push(newCell);
        selectedIds = new Set([newCell.id]);
        lastSelectedId = newCell.id;
        render();
        emitSelectionToHost();
        notifyAutosave();
        const hostCell = serializeCellForHost(newCell);
        postToHost({ event: 'dflow:inserted', cell: hostCell });
      }

      window.addEventListener('keydown', (ev) => {
        if (document.activeElement === inlineEditor) return;
        if (ev.code === 'Space' && !spaceKeyDown) {
          spaceKeyDown = true;
          container.classList.add('pan-mode');
        }
        if (isReadOnly) return;
        if ((ev.key === 'Delete' || ev.key === 'Backspace') && selectedIds.size > 0) {
          deleteSelected();
        } else if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'a') {
          ev.preventDefault();
          selectAllCells();
        } else if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'z') {
          ev.preventDefault();
          performUndo();
        } else if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'y') {
          ev.preventDefault();
          performRedo();
        }
      });

      window.addEventListener('keyup', (ev) => {
        if (ev.code === 'Space') {
          spaceKeyDown = false;
          if (pointerTool !== 'pan' && !isReadOnly) {
            container.classList.remove('pan-mode');
          }
        }
      });

      function selectAllCells() {
        selectedIds = new Set(cells.map(c => c.id));
        render();
        emitSelectionToHost();
      }

      function deleteSelected() {
        if (selectedIds.size === 0) return;
        saveHistory();
        cells = cells.filter(c => !selectedIds.has(c.id) && !selectedIds.has(c.source) && !selectedIds.has(c.target));
        selectedIds.clear();
        render();
        emitSelectionToHost();
        postToHost({ event: 'dflow:openProps', cell: null });
        notifyAutosave();
      }

      function performUndo() {
        if (undoStack.length === 0) return;
        redoStack.push(JSON.stringify(cells));
        cells = JSON.parse(undoStack.pop());
        render();
        emitSelectionToHost();
        notifyAutosave();
      }

      function performRedo() {
        if (redoStack.length === 0) return;
        undoStack.push(JSON.stringify(cells));
        cells = JSON.parse(redoStack.pop());
        render();
        emitSelectionToHost();
        notifyAutosave();
      }

      function exportPngDataUrl(callback) {
        const clone = svgStage.cloneNode(true);
        const rect = svgStage.getBoundingClientRect();
        const w = Math.max(800, rect.width || 1000);
        const h = Math.max(600, rect.height || 700);
        clone.setAttribute('width', w);
        clone.setAttribute('height', h);
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', '100%');
        bg.setAttribute('height', '100%');
        bg.setAttribute('fill', '#ffffff');
        clone.insertBefore(bg, clone.firstChild);
        const svgStr = new XMLSerializer().serializeToString(clone);
        const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          callback(canvas.toDataURL('image/png'));
        };
        img.onerror = () => callback('');
        img.src = url;
      }

      window.addEventListener('message', (ev) => {
        let msg = ev.data;
        if (typeof msg === 'string') {
          try { msg = JSON.parse(msg); } catch (e) { return; }
        }
        if (!msg || typeof msg !== 'object') return;
        const action = msg.action;

        if (action === 'configure') {
          postToHost({ event: 'dflow:ready' });
        } else if (action === 'load') {
          cells = parseXmlToCells(msg.xml || '');
          selectedIds.clear();
          undoStack = [];
          redoStack = [];
          render();
          postToHost({ event: 'load' });
        } else if (action === 'merge') {
          saveHistory();
          const incoming = parseXmlToCells(msg.xml || '');
          if (incoming.length > 0) {
            cells = incoming;
            render();
            fitViewport();
            notifyAutosave();
          }
        } else if (action === 'export') {
          const fmt = msg.format || 'xml';
          const xml = serializeCellsToXml();
          if (fmt === 'png') {
            exportPngDataUrl((dataUrl) => {
              postToHost({ event: 'export', format: 'png', data: dataUrl, xml });
            });
          } else {
            postToHost({ event: 'export', format: fmt, data: xml, xml });
          }
        } else if (action === 'invokeAction') {
          const act = msg.actionName;
          if (act === 'zoomIn') {
            zoom = Math.min(2.5, zoom * 1.15);
            render();
          } else if (act === 'zoomOut') {
            zoom = Math.max(0.25, zoom / 1.15);
            render();
          } else if (act === 'undo') {
            performUndo();
          } else if (act === 'redo') {
            performRedo();
          } else if (act === 'delete') {
            deleteSelected();
          } else if (act === 'selectAll') {
            selectAllCells();
          } else if (act === 'clearSelection') {
            selectedIds.clear();
            render();
            emitSelectionToHost();
          } else if (act === 'setPointerTool') {
            setPointerTool(msg.tool || 'select');
          } else if (act === 'align') {
            alignSelectedVertices(msg.alignMode);
          } else if (act === 'autoLayout') {
            autoLayoutGraph();
          } else if (act === 'toggleConnectMode') {
            setConnectMode(!connectModeActive);
          } else if (act === 'toggleGrid') {
            gridVisible = !gridVisible;
            container.classList.toggle('nogrid', !gridVisible);
            emitCanvasStats();
          } else if (act === 'copyStyle') {
            const firstId = Array.from(selectedIds)[0];
            const target = cells.find(c => c.id === firstId);
            if (target) {
              formatPainterStyle = target.style;
              emitCanvasStats();
            }
          } else if (act === 'bringToFront') {
            const targetIds = selectedIds.size > 0 ? selectedIds : (lastSelectedId ? new Set([lastSelectedId]) : null);
            if (!targetIds || targetIds.size === 0) return;
            saveHistory();
            const picked = cells.filter(c => targetIds.has(c.id));
            const rest = cells.filter(c => !targetIds.has(c.id));
            cells = [...rest, ...picked];
            render();
            notifyAutosave();
          } else if (act === 'sendToBack') {
            const targetIds = selectedIds.size > 0 ? selectedIds : (lastSelectedId ? new Set([lastSelectedId]) : null);
            if (!targetIds || targetIds.size === 0) return;
            saveHistory();
            const picked = cells.filter(c => targetIds.has(c.id));
            const rest = cells.filter(c => !targetIds.has(c.id));
            cells = [...picked, ...rest];
            render();
            notifyAutosave();
          } else if (act === 'bringForward') {
            const targetIds = selectedIds.size > 0 ? selectedIds : (lastSelectedId ? new Set([lastSelectedId]) : null);
            if (!targetIds || targetIds.size === 0) return;
            saveHistory();
            for (let i = cells.length - 2; i >= 0; i--) {
              if (targetIds.has(cells[i].id) && !targetIds.has(cells[i + 1].id)) {
                const tmp = cells[i];
                cells[i] = cells[i + 1];
                cells[i + 1] = tmp;
              }
            }
            render();
            notifyAutosave();
          } else if (act === 'sendBackward') {
            const targetIds = selectedIds.size > 0 ? selectedIds : (lastSelectedId ? new Set([lastSelectedId]) : null);
            if (!targetIds || targetIds.size === 0) return;
            saveHistory();
            for (let i = 1; i < cells.length; i++) {
              if (targetIds.has(cells[i].id) && !targetIds.has(cells[i - 1].id)) {
                const tmp = cells[i];
                cells[i] = cells[i - 1];
                cells[i - 1] = tmp;
              }
            }
            render();
            notifyAutosave();
          } else if (act === 'setZoom') {
            zoom = Math.max(0.25, Math.min(2.5, (msg.zoom || 100) / 100));
            render();
          } else if (act === 'pasteStyle' || act === 'applyCopiedStyle') {
            if (formatPainterStyle && selectedIds.size > 0) {
              saveHistory();
              cells.filter(c => selectedIds.has(c.id)).forEach(c => {
                c.style = formatPainterStyle;
              });
              render();
              notifyAutosave();
              emitSelectionToHost();
            }
          } else if (act === 'clearFormat') {
            if (selectedIds.size > 0) {
              saveHistory();
              cells.filter(c => selectedIds.has(c.id)).forEach(c => {
                if (c.vertex) {
                  c.style = 'rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#303133;strokeWidth=1;fontSize=13;fontFamily=微软雅黑;';
                } else if (c.edge) {
                  c.style = 'edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#303133;strokeWidth=1.5;endArrow=classic;';
                }
              });
              render();
              notifyAutosave();
              emitSelectionToHost();
            }
          }
        } else if (action === 'dflow:updateStyle') {
          if (msg.stylePatch) {
            Object.entries(msg.stylePatch).forEach(([k, v]) => {
              if (['fontFamily', 'fontSize', 'fontColor', 'fillColor', 'strokeColor', 'strokeWidth', 'dashed', 'dashPattern', 'fontStyle'].includes(k)) {
                defaultNodeStyle[k] = v;
              }
              if (['edgeStyle', 'strokeColor', 'strokeWidth', 'dashed', 'dashPattern', 'endArrow', 'flowAnimation'].includes(k)) {
                defaultEdgeStyle[k] = v;
              }
            });
          }

          let targetSet = msg.id
            ? (Array.isArray(msg.id) ? new Set(msg.id) : new Set([msg.id]))
            : (selectedIds.size > 0 ? selectedIds : (lastSelectedId ? new Set([lastSelectedId]) : null));

          if (!targetSet || targetSet.size === 0) {
            if (cells.length === 1) {
              targetSet = new Set([cells[0].id]);
            }
          }

          const targets = targetSet ? cells.filter(c => targetSet.has(c.id)) : [];
          if (targets.length > 0) {
            saveHistory();
            targets.forEach(target => {
              const map = parseStyle(target.style);
              Object.entries(msg.stylePatch || {}).forEach(([k, v]) => {
                if (v === null || v === undefined) {
                  delete map[k];
                } else {
                  map[k] = v;
                }
              });
              target.style = stringifyStyle(map);
            });
            render();
            notifyAutosave();
            emitSelectionToHost();
          }
        } else if (action === 'dflow:shapes') {
          (msg.shapes || []).forEach(s => { shapesCatalog[s.type] = s; });
        } else if (action === 'dflow:insert') {
          insertShapeAtClientPoint(msg, msg.clientX, msg.clientY, msg.clientX === undefined);
        } else if (action === 'dflow:setAttrs') {
          const target = cells.find(c => c.id === msg.id);
          if (target) {
            saveHistory();
            const incomingAttrs = msg.attrs || {};
            if (target.vertex) {
              target.attrs = { ...(target.attrs || {}), ...incomingAttrs };
              if (incomingAttrs.name !== undefined && incomingAttrs.name !== '') {
                target.value = incomingAttrs.name;
              } else if (incomingAttrs.label !== undefined) {
                target.value = incomingAttrs.label;
              }
            } else if (target.edge) {
              if (incomingAttrs.label !== undefined) target.value = incomingAttrs.label;
              const styleObj = parseStyle(target.style);
              if (incomingAttrs.fontColor) styleObj.fontColor = incomingAttrs.fontColor;
              if (incomingAttrs.labelBackgroundColor) styleObj.labelBackgroundColor = incomingAttrs.labelBackgroundColor;
              if (incomingAttrs.labelBorderColor) styleObj.labelBorderColor = incomingAttrs.labelBorderColor;
              target.style = stringifyStyle(styleObj);
            }
            render();
            notifyAutosave();
          }
        } else if (action === 'dflow:getCells') {
          postToHost({
            event: 'dflow:cells',
            cells: cells.map(serializeCellForHost)
          });
        } else if (action === 'dflow:highlight') {
          const target = cells.find(c => c.id === msg.id);
          if (target) {
            selectedIds = new Set([target.id]);
            const rect = container.getBoundingClientRect();
            panX = Math.round(rect.width / 2 - (target.x + target.width / 2) * zoom);
            panY = Math.round(rect.height / 2 - (target.y + target.height / 2) * zoom);
            render();
            emitSelectionToHost();
          }
        } else if (action === 'dflow:edit') {
          const target = cells.find(c => c.id === msg.id);
          if (target) {
            selectedIds = new Set([target.id]);
            render();
            emitSelectionToHost();
            postToHost({ event: 'dflow:openProps', cell: serializeCellForHost(target) });
          }
        } else if (action === 'dflow:refreshOverlays') {
          render();
        } else if (action === 'dflow:fit') {
          fitViewport(msg);
        }
      });

      setTimeout(() => {
        postToHost({ event: 'init', configure: 1 });
        postToHost({ event: 'dflow:ready' });
      }, 60);
    })();
  </script>
</body>
</html>
